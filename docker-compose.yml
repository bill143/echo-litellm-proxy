# ============================================================================
# ECHO — local hardened stack (phase-2)
#
#   echo      LiteLLM proxy (built from ./Dockerfile)        :4000
#   langfuse  observability UI + ingest (v2 — NO ClickHouse) :3000
#   postgres  backing store for Langfuse                     (internal)
#
# All secrets come from .env (git-ignored). See .env.example for the full
# list of variable NAMES this stack requires.
# ============================================================================

services:
  echo:
    build:
      context: .
      dockerfile: Dockerfile
    image: echo-litellm:phase-2
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      # Point LiteLLM's langfuse callback at the in-network Langfuse service.
      # LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY arrive via env_file (.env).
      LANGFUSE_HOST: http://langfuse:3000
      PORT: "4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      # Liveliness is unauthenticated, so the probe needs no master key.
      # The litellm image ships python but not curl — use urllib.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@postgres:5432/${LANGFUSE_DB_NAME}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      # Auto-provision an org/project/user with deterministic API keys on first
      # boot so LiteLLM's callback has working credentials out of the box.
      LANGFUSE_INIT_ORG_ID: echo-local
      LANGFUSE_INIT_PROJECT_ID: echo
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ECHO Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    restart: unless-stopped
    healthcheck:
      # Langfuse's Next.js server binds the container hostname, not localhost,
      # so probe via $(hostname). $$ escapes compose interpolation.
      test:
        - CMD
        - sh
        - -c
        - "wget -qO- http://$$(hostname):3000/api/public/health >/dev/null 2>&1 || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME}
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${LANGFUSE_DB_USER} -d $${LANGFUSE_DB_NAME}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  langfuse_pgdata:
    name: echo_langfuse_pgdata
